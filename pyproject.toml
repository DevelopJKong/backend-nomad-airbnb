[project]
authors = [{name = "cafe small house", email = "ybaram40@gmail.com"}]
dependencies = [
  "boto3>=1.43.62",
  "django>=5.2,<6",
  "django-ninja>=1.4.0",
  "environs>=11.0.0,<12",
  "httpx>=0.28.1",
  "pillow>=10.4.0,<11",
  "psycopg2>=2.9.9,<3",
  "sqids>=0.5.2",
]
description = ""
license = "MIT"
name = "airbnb"
readme = "README.md"
requires-python = ">=3.12"
version = "0.1.0"

[dependency-groups]
dev = [
  "django-stubs>=6.0.6",
  "djlint>=1.36.4",
  "ruff>=0.9.0",
]

[tool.djlint]
format_css = true
format_js = true
indent = 4
max_line_length = 160
profile = "django"

[tool.ruff]
line-length = 160
indent-width = 4

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.basedpyright]
# pyright는 requires-python을 읽지 않고 "선택된 인터프리터"의 버전을 쓴다.
# 에디터가 시스템 python(3.9)을 잡으면 `str | None` 문법이 에러가 나므로 버전을 명시로 고정한다.
pythonVersion = "3.12"
# 임포트 해석도 인터프리터 선택에 끌려다니지 않게 .venv로 못박는다.
venvPath = "."
venv = ".venv"
# basedpyright 기본값은 매우 엄격(recommended)해서 Django에 안 맞는 노이즈가 많음.
# 일반 pyright 수준(standard)으로 낮춰 의미 있는 진단만 남긴다.
typeCheckingMode = "standard"
# 미사용 파라미터(예: ninja 핸들러의 request)를 회색 hint 대신 노란색 경고로 표시
reportUnusedParameter = "warning"
# Django 모델 Meta 상속을 pyright가 비호환 override로 오판 → 끔
reportIncompatibleVariableOverride = "none"
